[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "donut-receipt-project"
version = "0.1.0"
description = "Receipt OCR and labeling project using Donut and Qwen vision models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "accelerate>=0.33.0",
    "Pillow>=10.0.0",
]

[tool.setuptools]
py-modules = ["misc"]
